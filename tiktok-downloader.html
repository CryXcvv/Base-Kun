<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Download video TikTok tanpa watermark - Basekun Tools">
    <title>TikTok Downloader — Basekun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-nav">
        <div class="nav-brand">
            <div class="nav-logo"><img src="logo.png" alt="Logo"></div>
            <span class="nav-brand-text">Basekun</span>
        </div>
        <a href="index.html" class="nav-back">
            <span class="material-symbols-outlined">arrow_back</span>
            Kembali
        </a>
    </nav>

    <div class="page-container">
        <div class="shape shape-circle" style="width:250px;height:250px;top:-30px;right:-60px;"><div class="shape-inner" style="animation:floatA 9s ease-in-out infinite;"></div></div>
        <div class="shape shape-ring" style="width:150px;height:150px;bottom:100px;left:-30px;"><div class="shape-inner" style="animation:floatB 11s ease-in-out infinite;"></div></div>
        <div class="shape shape-dot" style="width:60px;height:60px;top:40%;left:5%;"><div class="shape-inner" style="animation:floatA 7s ease-in-out infinite 1s;"></div></div>

        <div class="page-inner">
            <div class="hero">
                <div class="hero-badge">
                    <span class="pulse-dot"></span>
                    <span class="hero-badge-text">No Watermark</span>
                </div>
                <h1 class="hero-title">TikTok Downloader</h1>
                <p class="hero-subtitle">Paste link video TikTok dan download tanpa watermark secara gratis.</p>
            </div>

            <div class="card">
                <div class="input-group">
                    <div class="input-row">
                        <input type="text" class="text-input" id="tiktokUrl" placeholder="Paste link TikTok di sini..." autocomplete="off">
                    </div>
                    <button class="btn-primary" id="tiktokDownloadBtn" onclick="fetchTiktok()">
                        <span class="material-symbols-outlined">download</span>
                        Download Video
                    </button>
                </div>

                <div class="status-msg" id="tiktokStatus"></div>

                <div class="result-area" id="tiktokResult">
                    <div class="result-card">
                        <div class="result-preview">
                            <img id="tiktokThumb" src="" alt="Video Thumbnail" style="display:none;">
                            <video id="tiktokVideo" controls style="display:none;"></video>
                        </div>
                        <div class="result-info">
                            <span class="result-label">Judul</span>
                            <span class="result-value" id="tiktokTitle"></span>
                        </div>
                        <div class="result-info">
                            <span class="result-label">Author</span>
                            <span class="result-value" id="tiktokAuthor"></span>
                        </div>
                        <div class="result-actions">
                            <button class="btn-primary" id="downloadNoWm" onclick="downloadVideo('no_wm')">
                                <span class="material-symbols-outlined">download</span>
                                No Watermark
                            </button>
                            <button class="btn-secondary" id="downloadWm" onclick="downloadVideo('wm')">
                                <span class="material-symbols-outlined">download</span>
                                With Watermark
                            </button>
                            <button class="btn-secondary" id="downloadAudio" onclick="downloadVideo('audio')">
                                <span class="material-symbols-outlined">music_note</span>
                                Audio Only
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>Made with care by <a href="https://abrur.netlify.app/" target="_blank" rel="noopener noreferrer">Abrar Alhafizi</a></p>
        </footer>
    </div>

    <script>
        let videoData = null;

        function showStatus(msg, type) {
            const el = document.getElementById('tiktokStatus');
            el.className = 'status-msg active ' + type;
            el.innerHTML = '<span class="material-symbols-outlined">' + (type === 'success' ? 'check_circle' : 'error') + '</span>' + msg;
        }
        function hideStatus() { document.getElementById('tiktokStatus').className = 'status-msg'; }

        async function fetchTiktok() {
            let url = document.getElementById('tiktokUrl').value.trim();
            if (!url) { showStatus('Masukkan link TikTok terlebih dahulu!', 'error'); return; }
            
            const urlRegex = /(https?:\/\/[^\s]+)/;
            const matches = url.match(urlRegex);
            if (matches) {
                url = matches[0];
            }

            if (!url.includes('tiktok.com')) { showStatus('Link tidak valid. Gunakan link TikTok yang benar.', 'error'); return; }

            const btn = document.getElementById('tiktokDownloadBtn');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner active"></div> Memproses...';
            hideStatus();
            document.getElementById('tiktokResult').className = 'result-area';

            try {
                const apiUrl = 'https://www.tikwm.com/api/?url=' + encodeURIComponent(url);
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('API error');
                const result = await response.json();

                if (result.code !== 0) throw new Error(result.msg || 'Error');
                const data = result.data;

                if (data) {
                    videoData = data;
                    const thumb = document.getElementById('tiktokThumb');
                    const video = document.getElementById('tiktokVideo');

                    if (data.play) {
                        video.src = data.play;
                        video.style.display = 'block';
                        thumb.style.display = 'none';
                    } else if (data.images && data.images.length > 0) {
                        thumb.src = data.images[0];
                        thumb.style.display = 'block';
                        video.style.display = 'none';
                    }

                    document.getElementById('tiktokTitle').textContent = data.title || 'Untitled';
                    document.getElementById('tiktokAuthor').textContent = data.author ? (data.author.nickname || 'Unknown') : 'Unknown';
                    document.getElementById('tiktokResult').className = 'result-area active';
                    showStatus('Video ditemukan!', 'success');
                } else {
                    throw new Error('Data not found');
                }
            } catch (err) {
                console.error(err);
                showStatus('Gagal: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-outlined">download</span> Download Video';
            }
        }

        function downloadVideo(type) {
            if (!videoData) return;
            let url = '';
            let filename = 'tiktok_video';
            if (type === 'no_wm' && videoData.play) {
                url = videoData.play;
                filename = 'tiktok_no_watermark.mp4';
            } else if (type === 'wm' && videoData.wmplay) {
                url = videoData.wmplay;
                filename = 'tiktok_watermark.mp4';
            } else if (type === 'audio' && videoData.music) {
                url = videoData.music;
                filename = 'tiktok_audio.mp3';
            }
            if (url) {
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } else {
                showStatus('Link download tidak tersedia untuk opsi ini.', 'error');
            }
        }

        document.getElementById('tiktokUrl').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') fetchTiktok();
        });
    </script>
</body>
</html>
